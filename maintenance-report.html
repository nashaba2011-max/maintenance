<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Report</title>
<style>
  :root{
    --bg:#F5F2EC; --surface:#FFFFFF; --ink:#211E1A; --muted:#7A7268; --line:#E4DFD5;
    --primary:#2C4A3E; --primary-ink:#FFFFFF;
    --urgent:#B0432A; --warn:#C68A2E;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:24px 18px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:10px;}
  header h1{font-size:20px; margin:0; font-weight:700;}
  header .brand{font-size:13px; color:var(--muted);}
  .headerRight{display:flex; align-items:center; gap:10px;}
  #langToggle{width:auto; margin:0; padding:6px 12px; font-size:12.5px; font-weight:700; background:var(--surface); color:var(--primary); border:1px solid var(--primary); border-radius:100px; cursor:pointer;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px;}
  label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  select, textarea, input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:15px; background:#FCFBF9; color:var(--ink); font-family:inherit;
  }
  textarea{min-height:110px; resize:vertical;}
  .priority-row{display:flex; gap:8px;}
  .priority-row label.pill{
    flex:1; margin:0; text-align:center; padding:10px 6px; border:1px solid var(--line);
    border-radius:9px; cursor:pointer; font-size:13px; color:var(--ink); background:#FCFBF9;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .priority-row input{width:auto; margin:0;}
  .priority-row label:has(input:checked){border-color:var(--primary); background:#EDF2EF; font-weight:700;}
  .photo-drop{
    border:2px dashed var(--line); border-radius:10px; padding:20px; text-align:center;
    cursor:pointer; color:var(--muted); font-size:13.5px; background:#FCFBF9;
  }
  .photo-drop:hover{border-color:var(--primary);}
  #photoInput{display:none;}
  .thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .thumb{position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .thumb img, .thumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rm{
    position:absolute; top:2px; inset-inline-start:2px; background:rgba(33,30,26,.75); color:#fff; border:none;
    border-radius:100px; width:20px; height:20px; font-size:12px; line-height:1; cursor:pointer; padding:0;
  }
  button{
    width:100%; padding:13px; border:none; border-radius:9px; background:var(--primary);
    color:var(--primary-ink); font-size:15px; font-weight:700; cursor:pointer; margin-top:18px;
  }
  button:disabled{opacity:.5; cursor:default;}
  .msg{font-size:13px; margin-top:10px; min-height:16px;}
  .msg.err{color:var(--urgent);}
  .msg.ok{color:var(--primary);}
  .hidden{display:none !important;}
  .branch-tag{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .branch-tag b{color:var(--ink); font-size:15px;}
  .branch-tag a{color:var(--primary); font-size:12.5px; text-decoration:none; font-weight:600;}
  .homeLink{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--primary); text-decoration:none; margin-bottom:14px; padding:8px 16px; border:1px solid var(--primary); border-radius:100px; background:var(--surface); transition:all .2s ease;}
  .homeLink:hover{background:var(--primary); color:var(--primary-ink); transform:translateY(-1px); box-shadow:0 4px 10px rgba(44,74,62,.25);}
  .homeLink:active{transform:translateY(0); box-shadow:none;}
  .homeIcon{width:16px; height:16px; transition:transform .2s ease;}
  .homeLink:hover .homeIcon{transform:translateY(-1px) scale(1.08);}
  .waCheckList{margin-bottom:10px;}
  .waCheckRow{display:flex; align-items:center; gap:8px; padding:6px 0; cursor:pointer; font-size:13.5px; color:var(--ink);}
  .waCheckRow input{width:auto;}
</style>
</head>

let lang = "en";
let categories = [];

function t(key){ return I18N[lang][key]; }

function applyLanguage(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(key === "branchLabel") return;
    if(el.childElementCount === 0){ el.textContent = I18N[lang][key]; }
  });
  // branch label special-case (contains nested <b>)
  const branchLabelSpan = document.querySelector('[data-i18n="branchLabel"]');
  if(branchLabelSpan){
    const b = branchLabelSpan.querySelector("b");
    branchLabelSpan.textContent = t("branchLabel");
    if(b) branchLabelSpan.appendChild(b);
  }
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    el.placeholder = I18N[lang][el.getAttribute("data-i18n-placeholder")];
  });
  renderCategoryOptions();
}

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ throw new Error(await res.text()); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function uploadPhoto(path, file){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTOS_BUCKET}/${path}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": file.type || "application/octet-stream"
    },
    body: file
  });
  if(!res.ok){ throw new Error(await res.text()); }
  return `${SUPABASE_URL}/storage/v1/object/public/${PHOTOS_BUCKET}/${path}`;
}

let currentBranch = null;
let selectedFiles = [];

function renderCategoryOptions(){
  const catSel = document.getElementById("catSelect");
  const currentVal = catSel.value;
  catSel.innerHTML = `<option value="">${t("selectCategory")}</option>`;
  const groups = {equipment:t("equipment"), facility:t("facility")};
  Object.keys(groups).forEach(type=>{
    const og = document.createElement("optgroup");
    og.label = groups[type];
    categories.filter(c=>c.type===type).forEach(c=>{
      const o = document.createElement("option");
      o.value = c.id; o.textContent = lang === "en" ? (c.name_en || c.name) : c.name;
      og.appendChild(o);
    });
    catSel.appendChild(og);
  });
  catSel.value = currentVal;
}

function renderThumbs(){
  const wrap = document.getElementById("thumbs");
  wrap.innerHTML = "";
  selectedFiles.forEach((file, idx)=>{
    const div = document.createElement("div");
    div.className = "thumb";
    const isVideo = file.type.startsWith("video/");
    const media = document.createElement(isVideo ? "video" : "img");
    media.src = URL.createObjectURL(file);
    if(isVideo) media.muted = true;
    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "×";
    rm.addEventListener("click", ()=>{
      selectedFiles.splice(idx, 1);
      renderThumbs();
    });
    div.appendChild(media); div.appendChild(rm);
    if(isVideo){
      const badge = document.createElement("span");
      badge.textContent = "▶";
      badge.style.cssText = "position:absolute; bottom:2px; right:2px; background:rgba(33,30,26,.75); color:#fff; font-size:11px; padding:1px 5px; border-radius:6px;";
      div.appendChild(badge);
    }
    wrap.appendChild(div);
  });
}

function escapeSlug(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

function buildFileName(originalName, isVideo){
  const dotIdx = originalName.lastIndexOf(".");
  const ext = isVideo
    ? (dotIdx > 0 ? originalName.slice(dotIdx+1).toLowerCase().replace(/[^a-z0-9]/g,"") || "mp4" : "mp4")
    : "jpg";
  const base = dotIdx > 0 ? originalName.slice(0, dotIdx) : originalName;
  return `${escapeSlug(base) || "file"}.${ext}`;
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
        else{ width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objectUrl);
      canvas.toBlob((blob)=>{
        resolve(blob ? blob : file);
      }, "image/jpeg", quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); resolve(file); };
    img.src = objectUrl;
  });
}

document.getElementById("submitBtn").addEventListener("click", async ()=>{
  const catSelect = document.getElementById("catSelect");
  const catId = catSelect.value;
  const catName = catSelect.selectedOptions[0] ? catSelect.selectedOptions[0].textContent : "";
  const priority = document.querySelector('input[name="priority"]:checked').value;
  const desc = document.getElementById("descBox").value.trim();
  const reporter = document.getElementById("reporterName").value.trim();
  const msgEl = document.getElementById("reportMsg");
  const btn = document.getElementById("submitBtn");
  msgEl.className = "msg"; msgEl.textContent = "";
  document.getElementById("waNotifyBox").innerHTML = "";

  if(!catId){ msgEl.className = "msg err"; msgEl.textContent = t("selectCategoryFirst"); return; }
  if(!desc){ msgEl.className = "msg err"; msgEl.textContent = t("writeDescription"); return; }

  btn.disabled = true; btn.textContent = t("submitting");
  try{
    const created = await sb("maintenance_tickets", {
      method: "POST",
      body: JSON.stringify({
        branch_id: currentBranch.id,
        category_id: catId,
        priority: priority,
        description: desc,
        reported_by: reporter || null
      })
    });
    const ticket = created[0];

    if(selectedFiles.length){
      btn.textContent = `${t("uploadingAttachments")} (0/${selectedFiles.length})...`;
      for(let i=0; i<selectedFiles.length; i++){
        const file = selectedFiles[i];
        const isVideo = file.type.startsWith("video/");
        const uploadBlob = isVideo ? file : await compressImage(file, 1600, 0.75);
        const fileName = buildFileName(file.name, isVideo);
        const path = `${ticket.id}/${Date.now()}-${i}-${fileName}`;
        const url = await uploadPhoto(path, uploadBlob);
        await sb("ticket_photos", { method:"POST", body: JSON.stringify({ ticket_id: ticket.id, url }) });
        btn.textContent = `${t("uploadingAttachments")} (${i+1}/${selectedFiles.length})...`;
      }
    }

    msgEl.className = "msg ok";
    msgEl.textContent = `${t("reportSuccess")} ${t("ticketNumberLabel")}${ticket.ticket_number}`;

    try{
      const settingsRows = await sb("admin_settings?select=team_whatsapp_numbers&limit=1");
      const numbers = (settingsRows[0]?.team_whatsapp_numbers || "").split(",").map(s=>s.trim()).filter(Boolean);
      if(numbers.length){
        const priorityLabel = t(priority);
        const waText = encodeURIComponent(t("newTicketMsg")(ticket.ticket_number, currentBranch.name, catName, priorityLabel, desc));
        const box = document.getElementById("waNotifyBox");
        if(numbers.length === 1){
          box.innerHTML = `<div style="font-size:12.5px; color:var(--muted); margin-top:14px; margin-bottom:6px;">${t("sendWhatsappAlert")}</div>` +
            `<button type="button" class="waSendBtn" data-num="${numbers[0]}" style="margin-top:6px; background:#25D366;">${t("sendViaWhatsapp")}</button>`;
          box.querySelector(".waSendBtn").addEventListener("click", ()=>{
            window.open(`https://wa.me/${numbers[0]}?text=${waText}`, "_blank");
          });
        }else{
          box.innerHTML = `<div style="font-size:12.5px; color:var(--muted); margin-top:14px; margin-bottom:6px;">${t("sendWhatsappAlert")}</div>` +
            `<div class="waCheckList">` +
            numbers.map((num,idx)=>`
              <label class="waCheckRow">
                <input type="checkbox" class="waNumCheck" value="${num}" checked>
                <span>${t("recipient")} ${idx+1} (${num})</span>
              </label>
            `).join("") +
            `</div>` +
            `<button type="button" id="waSendSelectedBtn" style="background:#25D366;">${t("sendViaWhatsapp")}</button>`;
          document.getElementById("waSendSelectedBtn").addEventListener("click", ()=>{
            const selected = Array.from(box.querySelectorAll(".waNumCheck:checked")).map(c=>c.value);
            selected.forEach(num=>{
              window.open(`https://wa.me/${num}?text=${waText}`, "_blank");
            });
          });
        }
      }
    }catch(e){}

    document.getElementById("catSelect").value = "";
    document.getElementById("descBox").value = "";
    document.getElementById("reporterName").value = "";
    document.querySelector('input[name="priority"][value="normal"]').checked = true;
    selectedFiles = [];
    renderThumbs();
  }catch(e){
    msgEl.className = "msg err";
    msgEl.textContent = t("reportFail");
  }finally{
    btn.disabled = false; btn.textContent = t("submitReport");
  }
});

function enableEnterNav(containerId, buttonId){
  const container = document.getElementById(containerId);
  const button = document.getElementById(buttonId);
  container.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const tag = e.target.tagName;
    if(tag === "TEXTAREA" || tag === "BUTTON" || tag === "A") return;
    e.preventDefault();
    const items = Array.from(container.querySelectorAll('input:not([type=radio]):not([type=checkbox]):not([type=file]), select'));
    const idx = items.indexOf(e.target);
    if(idx > -1 && idx < items.length - 1){
      items[idx+1].focus();
    }else{
      button.click();
    }
  });
}
enableEnterNav("branchCard", "continueBtn");
enableEnterNav("reportCard", "submitBtn");

applyLanguage();
init();
</script>
