<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Admin Dashboard</title>
<style>
  :root{
    --bg:#F5F2EC; --surface:#FFFFFF; --ink:#211E1A; --muted:#7A7268; --line:#E4DFD5;
    --primary:#2C4A3E; --primary-ink:#FFFFFF;
    --urgent:#B0432A; --warn:#C68A2E; --closed:#7C8A80;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1100px; margin:0 auto; padding:24px 18px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:10px;}
  header h1{font-size:21px; margin:0; font-weight:700;}
  header .brand{font-size:13px; color:var(--muted);}
  .pageNav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .pageNav a{padding:7px 14px; border-radius:100px; border:1px solid var(--line); background:var(--surface); color:var(--ink); text-decoration:none; font-size:13px; font-weight:600;}
  .pageNav a.active{background:var(--primary); color:var(--primary-ink); border-color:var(--primary);}
  #langToggle{width:auto; margin:0; padding:6px 12px; font-size:12.5px; font-weight:700; background:var(--surface); color:var(--primary); border:1px solid var(--primary); border-radius:100px; cursor:pointer;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .stat .num{font-size:26px; font-weight:800; line-height:1;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:6px;}
  .stat.urgent .num{color:var(--urgent);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px;}
  .filters{display:flex; gap:10px; flex-wrap:wrap;}
  .filters > div{flex:1; min-width:140px;}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  select, input, textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#FCFBF9; color:var(--ink); font-family:inherit;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:start; font-size:11.5px; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .status-pill{font-size:11px; padding:3px 9px; border-radius:100px; font-weight:700; white-space:nowrap;}
  .status-open{background:#F6E4DE; color:var(--urgent);}
  .status-in_progress{background:#F7EBD7; color:#8A5F14;}
  .status-closed{background:#EAEBE8; color:var(--closed);}
  .priority-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px;}
  .priority-urgent{color:var(--urgent); background:#F6E4DE;}
  .priority-normal{color:var(--ink); background:#EEECE6;}
  .priority-low{color:var(--muted); background:#EEECE6;}
  .empty{color:var(--muted); text-align:center; padding:40px 0;}
  .table-wrap{overflow-x:auto;}
  .mediaCell{display:flex; gap:4px; flex-wrap:wrap;}
  .mediaThumbSm{position:relative; width:36px; height:36px; border-radius:6px; overflow:hidden; border:1px solid var(--line); display:block; flex-shrink:0;}
  .mediaThumbSm img, .mediaThumbSm video{width:100%; height:100%; object-fit:cover; display:block;}
  .mediaThumbSm .playBadgeSm{position:absolute; bottom:0; inset-inline-end:0; background:rgba(33,30,26,.75); color:#fff; font-size:8px; padding:0 2px; border-radius:3px;}
  .section-title{font-size:15px; font-weight:700; margin:0 0 12px;}
  .breakdown{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .breakdown span{font-size:12px; background:#EEECE6; padding:4px 10px; border-radius:100px; color:var(--ink);}
  .hidden{display:none !important;}
  .msg{font-size:13px; margin-top:8px;}
  .msg.err{color:var(--urgent);}
  .msg.ok{color:var(--primary);}
  .login-card{max-width:360px; margin:60px auto 0;}
  #savePassBtn, #saveBranchPassBtn, #saveBranchWaBtn, #saveTeamWaBtn{padding:11px; border:none; border-radius:9px; background:var(--primary); color:var(--primary-ink); font-size:14px; font-weight:700; cursor:pointer;}
  #savePassBtn:disabled, #saveBranchPassBtn:disabled, #saveBranchWaBtn:disabled, #saveTeamWaBtn:disabled{opacity:.5; cursor:default;}
</style>
</head>

let lang = "en";
function t(key){ return I18N[lang][key]; }

function applyStaticLanguage(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    if(el.childElementCount === 0){ el.textContent = t(el.getAttribute("data-i18n")); }
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
  });
}

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ throw new Error(await res.text()); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

let allTickets = [];
let branches = [];
let categories = [];
let mediaByTicket = {};

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function renderCatOptions(){
  const cSel = document.getElementById("catFilter");
  const currentVal = cSel.value;
  cSel.innerHTML = `<option value="">${t("allCategories")}</option>`;
  categories.forEach(c=>{
    const o = document.createElement("option"); o.value=c.id; o.textContent = lang === "en" ? (c.name_en || c.name) : c.name; cSel.appendChild(o);
  });
  cSel.value = currentVal;
}

async function init(){
  branches = await sb("branches?select=id,name,maintenance_password,manager_whatsapp&order=name.asc");
  categories = await sb("maintenance_categories?select=id,name,name_en&order=name_en.asc");
  const bSel = document.getElementById("branchFilter");
  branches.forEach(b=>{
    const o = document.createElement("option"); o.value=b.id; o.textContent=b.name; bSel.appendChild(o);
  });
  renderCatOptions();
  renderBranchPassList();
  renderBranchWaList();
  const settingsRows = await sb("admin_settings?select=team_whatsapp_numbers&limit=1");
  document.getElementById("teamWaNumbers").value = (settingsRows[0]?.team_whatsapp_numbers || "").replace(/,/g, "\n");

  allTickets = await sb("maintenance_tickets?select=*,branches(name),maintenance_categories(name,name_en),maintenance_staff(name)&order=created_at.desc");
  const photoRows = await sb("ticket_photos?select=ticket_id,url&order=created_at.asc");
  mediaByTicket = {};
  photoRows.forEach(p=>{
    if(!mediaByTicket[p.ticket_id]) mediaByTicket[p.ticket_id] = [];
    mediaByTicket[p.ticket_id].push(p.url);
  });
  renderStats();
  renderBranchBreakdown();
  renderTable();

  ["statusFilter","branchFilter","catFilter","priorityFilter"].forEach(id=>{
    document.getElementById(id).addEventListener("change", renderTable);
  });
}

function renderStats(){
  const open = allTickets.filter(t=>t.status==="open").length;
  const inProgress = allTickets.filter(t=>t.status==="in_progress").length;
  const urgent = allTickets.filter(t=>t.status!=="closed" && t.priority==="urgent").length;
  const closedTickets = allTickets.filter(t=>t.status==="closed" && t.closed_at);
  let avgHours = t("dash");
  if(closedTickets.length){
    const totalMs = closedTickets.reduce((sum,tk)=> sum + (new Date(tk.closed_at)-new Date(tk.created_at)), 0);
    avgHours = Math.round(totalMs / closedTickets.length / 3600000) + " " + t("hrs");
  }
  const totalCost = allTickets.reduce((sum,tk)=> sum + (tk.cost || 0), 0);
  const row = document.getElementById("statsRow");
  row.innerHTML = `
    <div class="stat"><div class="num">${open}</div><div class="lbl">${t("openTickets")}</div></div>
    <div class="stat"><div class="num">${inProgress}</div><div class="lbl">${t("inProgressLbl")}</div></div>
    <div class="stat urgent"><div class="num">${urgent}</div><div class="lbl">${t("urgentUnresolved")}</div></div>
    <div class="stat"><div class="num">${allTickets.length}</div><div class="lbl">${t("totalTickets")}</div></div>
    <div class="stat"><div class="num">${avgHours}</div><div class="lbl">${t("avgClose")}</div></div>
    <div class="stat"><div class="num">${totalCost.toFixed(3)}</div><div class="lbl">${t("totalCost")}</div></div>
  `;
}

function renderBranchBreakdown(){
  const el = document.getElementById("branchBreakdown");
  const counts = {};
  allTickets.filter(tk=>tk.status!=="closed").forEach(tk=>{
    const name = tk.branches?.name || t("dash");
    counts[name] = (counts[name]||0) + 1;
  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(entries.length === 0){
    el.innerHTML = `<span>${t("noOpenTickets")}</span>`;
    return;
  }
  el.innerHTML = entries.map(([name,count])=>`<span>${escapeHtml(name)}: ${count}</span>`).join("");
}

function renderMediaCell(urls){
  if(!urls || urls.length === 0) return t("dash");
  return `<div class="mediaCell">` + urls.map(url=>{
    const isVideo = /\.(mp4|mov|webm|m4v|avi)$/i.test(url);
    return isVideo
      ? `<a href="${url}" target="_blank" class="mediaThumbSm"><video src="${url}" muted onerror="this.closest('a').style.display='none'"></video><span class="playBadgeSm">▶</span></a>`
      : `<a href="${url}" target="_blank" class="mediaThumbSm"><img src="${url}" onerror="this.closest('a').style.display='none'"></a>`;
  }).join("") + `</div>`;
}

function renderTable(){
  const status = document.getElementById("statusFilter").value;
  const branchId = document.getElementById("branchFilter").value;
  const catId = document.getElementById("catFilter").value;
  const priority = document.getElementById("priorityFilter").value;

  let rows = allTickets;
  if(status) rows = rows.filter(tk=>tk.status===status);
  if(branchId) rows = rows.filter(tk=>tk.branch_id===branchId);
  if(catId) rows = rows.filter(tk=>tk.category_id===catId);
  if(priority) rows = rows.filter(tk=>tk.priority===priority);

  const area = document.getElementById("tableArea");
  if(rows.length === 0){
    area.innerHTML = `<div class="empty">${t("noMatchingTickets")}</div>`;
    return;
  }

  const localeStr = lang === "ar" ? "ar-BH" : "en-GB";
  area.innerHTML = `
    <table>
      <thead><tr>
        <th>${t("colTicketNum")}</th><th>${t("colBranch")}</th><th>${t("colCategory")}</th><th>${t("colDesc")}</th><th>${t("colMedia")}</th><th>${t("colPriority")}</th><th>${t("colStatus")}</th><th>${t("colTech")}</th><th>${t("colReported")}</th><th>${t("colStarted")}</th><th>${t("colFinished")}</th><th>${t("colAuthorized")}</th><th>${t("colPerformed")}</th><th>${t("colApproved")}</th><th>${t("colCost")}</th><th></th>
      </tr></thead>
      <tbody>
        ${rows.map(tk=>`
          <tr>
            <td>#${tk.ticket_number}</td>
            <td>${escapeHtml(tk.branches?.name || t("dash"))}</td>
            <td>${escapeHtml((lang==="en" ? (tk.maintenance_categories?.name_en || tk.maintenance_categories?.name) : tk.maintenance_categories?.name) || t("dash"))}</td>
            <td style="max-width:220px;">${escapeHtml(tk.description)}</td>
            <td>${renderMediaCell(mediaByTicket[tk.id])}</td>
            <td><span class="priority-tag priority-${tk.priority}">${t(tk.priority)}</span></td>
            <td><span class="status-pill status-${tk.status}">${t(tk.status)}</span></td>
            <td>${escapeHtml(tk.maintenance_staff?.name || t("dash"))}</td>
            <td>${new Date(tk.created_at).toLocaleString(localeStr, {dateStyle:"short", timeStyle:"short"})}</td>
            <td>${tk.started_at ? new Date(tk.started_at).toLocaleString(localeStr, {dateStyle:"short", timeStyle:"short"}) : t("dash")}</td>
            <td>${tk.closed_at ? new Date(tk.closed_at).toLocaleString(localeStr, {dateStyle:"short", timeStyle:"short"}) : t("dash")}</td>
            <td>${escapeHtml(tk.authorized_by || t("dash"))}</td>
            <td>${escapeHtml(tk.performed_by || t("dash"))}</td>
            <td>${escapeHtml(tk.approved_by || t("dash"))}</td>
            <td>${tk.cost != null ? tk.cost.toFixed(3) : t("dash")}</td>
            <td><button type="button" class="deleteTicketBtn" data-id="${tk.id}" style="background:transparent; color:var(--urgent); border:1px solid var(--urgent); padding:5px 10px; font-size:12px; white-space:nowrap;">${t("delete")}</button></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  area.querySelectorAll(".deleteTicketBtn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!confirm(t("confirmDelete"))) return;
      btn.disabled = true; btn.textContent = "...";
      try{
        await sb(`maintenance_tickets?id=eq.${btn.dataset.id}`, { method:"DELETE" });
        allTickets = allTickets.filter(x=>x.id !== btn.dataset.id);
        renderStats();
        renderBranchBreakdown();
        renderTable();
      }catch(e){
        alert(t("saveFail"));
        btn.disabled = false; btn.textContent = t("delete");
      }
    });
  });
}

document.getElementById("savePassBtn").addEventListener("click", async ()=>{
  const newAdmin = document.getElementById("newAdminPass").value;
  const newTeam = document.getElementById("newTeamPass").value;
  const msgEl = document.getElementById("passMsg");
  const btn = document.getElementById("savePassBtn");
  msgEl.className = "msg"; msgEl.textContent = "";

  if(!newAdmin && !newTeam){
    msgEl.className = "msg err"; msgEl.textContent = t("enterAtLeastOne");
    return;
  }

  const patch = {};
  if(newAdmin) patch.admin_password = newAdmin;
  if(newTeam) patch.maintenance_password = newTeam;

  btn.disabled = true; btn.textContent = t("saving");
  try{
    await sb("admin_settings?id=eq.true", { method:"PATCH", body: JSON.stringify(patch) });
    msgEl.className = "msg ok";
    msgEl.textContent = t("passwordsSaved");
    document.getElementById("newAdminPass").value = "";
    document.getElementById("newTeamPass").value = "";
  }catch(e){
    msgEl.className = "msg err";
    msgEl.textContent = t("saveFail");
  }finally{
    btn.disabled = false; btn.textContent = t("save");
  }
});

function enableEnterNav(containerId, buttonId){
  const container = document.getElementById(containerId);
  const button = document.getElementById(buttonId);
  container.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const tag = e.target.tagName;
    if(tag === "TEXTAREA" || tag === "BUTTON" || tag === "A") return;
    e.preventDefault();
    const items = Array.from(container.querySelectorAll('input:not([type=radio]):not([type=checkbox]):not([type=file]), select'));
    const idx = items.indexOf(e.target);
    if(idx > -1 && idx < items.length - 1){
      items[idx+1].focus();
    }else{
      button.click();
    }
  });
}
