<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Report</title>
<style>
  :root{
    --bg:#F5F2EC; --surface:#FFFFFF; --ink:#211E1A; --muted:#7A7268; --line:#E4DFD5;
    --primary:#2C4A3E; --primary-ink:#FFFFFF;
    --urgent:#B0432A; --warn:#C68A2E;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:24px 18px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  header h1{font-size:20px; margin:0; font-weight:700;}
  header .brand{font-size:13px; color:var(--muted);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px;}
  label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  select, textarea, input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:15px; background:#FCFBF9; color:var(--ink); font-family:inherit;
  }
  textarea{min-height:110px; resize:vertical;}
  .priority-row{display:flex; gap:8px;}
  .priority-row label.pill{
    flex:1; margin:0; text-align:center; padding:10px 6px; border:1px solid var(--line);
    border-radius:9px; cursor:pointer; font-size:13px; color:var(--ink); background:#FCFBF9;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .priority-row input{width:auto; margin:0;}
  .priority-row label:has(input:checked){border-color:var(--primary); background:#EDF2EF; font-weight:700;}
  .photo-drop{
    border:2px dashed var(--line); border-radius:10px; padding:20px; text-align:center;
    cursor:pointer; color:var(--muted); font-size:13.5px; background:#FCFBF9;
  }
  .photo-drop:hover{border-color:var(--primary);}
  #photoInput{display:none;}
  .thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .thumb{position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(33,30,26,.75); color:#fff; border:none;
    border-radius:100px; width:20px; height:20px; font-size:12px; line-height:1; cursor:pointer; padding:0;
  }
  button{
    width:100%; padding:13px; border:none; border-radius:9px; background:var(--primary);
    color:var(--primary-ink); font-size:15px; font-weight:700; cursor:pointer; margin-top:18px;
  }
  button:disabled{opacity:.5; cursor:default;}
  .msg{font-size:13px; margin-top:10px; min-height:16px;}
  .msg.err{color:var(--urgent);}
  .msg.ok{color:var(--primary);}
  .hidden{display:none !important;}
  .branch-tag{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .branch-tag b{color:var(--ink); font-size:15px;}
  .branch-tag a{color:var(--primary); font-size:12.5px; text-decoration:none; font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Maintenance Report</h1>
    <span class="brand">Fareeq Bin Aqool / Just Buns</span>
  </header>

  <!-- Step 1: choose branch -->
  <div id="branchCard" class="card">
    <label for="branchSelect">Select Branch</label>
    <select id="branchSelect"><option value="">Select branch...</option></select>
    <label for="branchPass">Branch Password</label>
    <input id="branchPass" type="password" placeholder="Password">
    <button id="continueBtn">Continue</button>
    <div id="loginMsg" class="msg err"></div>
    <a href="#" id="forgotPassLink" style="display:block; text-align:center; font-size:12.5px; color:var(--primary); text-decoration:none; margin-top:10px; font-weight:600;">Forgot password?</a>
  </div>

  <!-- Step 2: report -->
  <div id="reportCard" class="card hidden">
    <div class="branch-tag">
      <span>Branch: <b id="branchNameLbl"></b></span>
      <a href="#" id="changeBranchLink">Change branch</a>
    </div>

    <label for="catSelect">Problem Type</label>
    <select id="catSelect"><option value="">Select category...</option></select>

    <label>Priority</label>
    <div class="priority-row">
      <label class="pill"><input type="radio" name="priority" value="urgent"><span>Urgent</span></label>
      <label class="pill"><input type="radio" name="priority" value="normal" checked><span>Normal</span></label>
      <label class="pill"><input type="radio" name="priority" value="low"><span>Low</span></label>
    </div>

    <label for="descBox">Problem Description / Report</label>
    <textarea id="descBox" placeholder="Describe the issue..."></textarea>

    <label for="reporterName">Your Name</label>
    <input id="reporterName" type="text" placeholder="Your name (optional)">

    <label>Photos (optional)</label>
    <div class="photo-drop" id="photoDrop">Tap here to add photos</div>
    <input id="photoInput" type="file" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>

    <button id="submitBtn">Submit Report</button>
    <div id="reportMsg" class="msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lzadmbjhcxqvafykntsp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6YWRtYmpoY3hxdmFmeWtudHNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjQwOTYsImV4cCI6MjEwNTA0MDA5Nn0.HNGwF8_lHrUHU_Xhx9Ymn0eoLHGaJ2GVd69umNNkXCI";
const PHOTOS_BUCKET = "maintenance-photos";

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ throw new Error(await res.text()); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function uploadPhoto(path, file){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTOS_BUCKET}/${path}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": file.type || "application/octet-stream"
    },
    body: file
  });
  if(!res.ok){ throw new Error(await res.text()); }
  return `${SUPABASE_URL}/storage/v1/object/public/${PHOTOS_BUCKET}/${path}`;
}

let currentBranch = null;
let selectedFiles = [];

async function init(){
  try{
    const branches = await sb("branches?select=id,name&order=name.asc");
    const sel = document.getElementById("branchSelect");
    branches.forEach(b=>{
      const o = document.createElement("option");
      o.value = b.id; o.dataset.name = b.name; o.textContent = b.name;
      sel.appendChild(o);
    });
    const categories = await sb("maintenance_categories?select=*&order=type.asc,name_en.asc");
    const catSel = document.getElementById("catSelect");
    const groups = {equipment:"Equipment", facility:"Facility"};
    Object.keys(groups).forEach(type=>{
      const og = document.createElement("optgroup");
      og.label = groups[type];
      categories.filter(c=>c.type===type).forEach(c=>{
        const o = document.createElement("option");
        o.value = c.id; o.textContent = c.name_en || c.name;
        og.appendChild(o);
      });
      catSel.appendChild(og);
    });
  }catch(e){
    document.getElementById("branchCard").insertAdjacentHTML("beforeend", '<div class="msg err">Could not load branch data.</div>');
  }
}

document.getElementById("forgotPassLink").addEventListener("click", async (e)=>{
  e.preventDefault();
  const sel = document.getElementById("branchSelect");
  const msgEl = document.getElementById("loginMsg");
  if(!sel.value){
    msgEl.textContent = "Please select a branch first.";
    return;
  }
  const branchName = sel.selectedOptions[0].textContent;
  const text = encodeURIComponent(`Hi, I forgot the password for the ${branchName} branch in the maintenance report system. Could you send it to me?`);
  try{
    const rows = await sb(`branches?id=eq.${sel.value}&select=manager_whatsapp`);
    const number = rows[0]?.manager_whatsapp;
    if(!number){
      msgEl.textContent = "No WhatsApp number is set for this branch's manager yet.";
      return;
    }
    window.open(`https://wa.me/${number}?text=${text}`, "_blank");
  }catch(e){
    msgEl.textContent = "Something went wrong. Please try again.";
  }
});

document.getElementById("continueBtn").addEventListener("click", async ()=>{
  const sel = document.getElementById("branchSelect");
  const pass = document.getElementById("branchPass").value;
  const msgEl = document.getElementById("loginMsg");
  msgEl.textContent = "";
  if(!sel.value){ msgEl.textContent = "Please select a branch."; return; }
  try{
    const rows = await sb(`branches?id=eq.${sel.value}&select=id,name,maintenance_password`);
    if(rows.length === 0 || rows[0].maintenance_password !== pass){
      msgEl.textContent = "Incorrect password.";
      return;
    }
    currentBranch = { id: rows[0].id, name: rows[0].name };
    document.getElementById("branchNameLbl").textContent = currentBranch.name;
    document.getElementById("branchCard").classList.add("hidden");
    document.getElementById("reportCard").classList.remove("hidden");
  }catch(e){
    msgEl.textContent = "Something went wrong. Please try again.";
  }
});

document.getElementById("changeBranchLink").addEventListener("click", (e)=>{
  e.preventDefault();
  document.getElementById("reportCard").classList.add("hidden");
  document.getElementById("branchCard").classList.remove("hidden");
});

document.getElementById("photoDrop").addEventListener("click", ()=>{
  document.getElementById("photoInput").click();
});

document.getElementById("photoInput").addEventListener("change", (e)=>{
  selectedFiles = selectedFiles.concat(Array.from(e.target.files));
  renderThumbs();
  e.target.value = "";
});

function renderThumbs(){
  const wrap = document.getElementById("thumbs");
  wrap.innerHTML = "";
  selectedFiles.forEach((file, idx)=>{
    const div = document.createElement("div");
    div.className = "thumb";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "×";
    rm.addEventListener("click", ()=>{
      selectedFiles.splice(idx, 1);
      renderThumbs();
    });
    div.appendChild(img); div.appendChild(rm);
    wrap.appendChild(div);
  });
}

function escapeSlug(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

document.getElementById("submitBtn").addEventListener("click", async ()=>{
  const catId = document.getElementById("catSelect").value;
  const priority = document.querySelector('input[name="priority"]:checked').value;
  const desc = document.getElementById("descBox").value.trim();
  const reporter = document.getElementById("reporterName").value.trim();
  const msgEl = document.getElementById("reportMsg");
  const btn = document.getElementById("submitBtn");
  msgEl.className = "msg"; msgEl.textContent = "";

  if(!catId){ msgEl.className = "msg err"; msgEl.textContent = "Please select a problem type."; return; }
  if(!desc){ msgEl.className = "msg err"; msgEl.textContent = "Please write a description."; return; }

  btn.disabled = true; btn.textContent = "Submitting...";
  try{
    const created = await sb("maintenance_tickets", {
      method: "POST",
      body: JSON.stringify({
        branch_id: currentBranch.id,
        category_id: catId,
        priority: priority,
        description: desc,
        reported_by: reporter || null
      })
    });
    const ticket = created[0];

    if(selectedFiles.length){
      btn.textContent = `Uploading photos (0/${selectedFiles.length})...`;
      for(let i=0; i<selectedFiles.length; i++){
        const file = selectedFiles[i];
        const path = `${ticket.id}/${Date.now()}-${i}-${escapeSlug(file.name)}`;
        const url = await uploadPhoto(path, file);
        await sb("ticket_photos", { method:"POST", body: JSON.stringify({ ticket_id: ticket.id, url }) });
        btn.textContent = `Uploading photos (${i+1}/${selectedFiles.length})...`;
      }
    }

    msgEl.className = "msg ok";
    msgEl.textContent = "Report submitted successfully.";
    document.getElementById("catSelect").value = "";
    document.getElementById("descBox").value = "";
    document.getElementById("reporterName").value = "";
    document.querySelector('input[name="priority"][value="normal"]').checked = true;
    selectedFiles = [];
    renderThumbs();
  }catch(e){
    msgEl.className = "msg err";
    msgEl.textContent = "Could not submit report. Please try again.";
  }finally{
    btn.disabled = false; btn.textContent = "Submit Report";
  }
});

init();
</script>
</body>
</html>
