<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فريق الصيانة</title>
<style>
  :root{
    --bg:#F5F2EC; --surface:#FFFFFF; --ink:#211E1A; --muted:#7A7268; --line:#E4DFD5;
    --primary:#2C4A3E; --primary-ink:#FFFFFF;
    --urgent:#B0432A; --warn:#C68A2E; --closed:#7C8A80;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:820px; margin:0 auto; padding:24px 18px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  header h1{font-size:20px; margin:0; font-weight:700;}
  header .brand{font-size:13px; color:var(--muted);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px;}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  select, input{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#FCFBF9; color:var(--ink); font-family:inherit;}
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .filters > div{flex:1; min-width:130px;}
  .filters select{width:100%;}
  .ticket{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--surface);}
  .ticket-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .branch-name{font-weight:700; font-size:15px;}
  .status-pill{font-size:11px; padding:3px 10px; border-radius:100px; font-weight:700; white-space:nowrap;}
  .status-open{background:#F6E4DE; color:var(--urgent);}
  .status-in_progress{background:#F7EBD7; color:#8A5F14;}
  .status-closed{background:#EAEBE8; color:var(--closed);}
  .priority-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; margin-right:6px;}
  .priority-urgent{color:var(--urgent); background:#F6E4DE;}
  .priority-normal{color:var(--ink); background:#EEECE6;}
  .priority-low{color:var(--muted); background:#EEECE6;}
  .ticket-desc{font-size:14px; margin:8px 0; line-height:1.5;}
  .ticket-meta{font-size:12px; color:var(--muted); margin-bottom:10px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .row select, .row button{flex:1; min-width:120px;}
  button{padding:10px 14px; border:none; border-radius:8px; background:var(--primary); color:var(--primary-ink); font-size:13px; font-weight:700; cursor:pointer;}
  button.ghost{background:transparent; color:var(--primary); border:1px solid var(--primary);}
  button:disabled{opacity:.5; cursor:default;}
  .notes{margin-top:10px; border-top:1px solid var(--line); padding-top:10px;}
  .note{font-size:13px; margin-bottom:6px; color:var(--ink);}
  .note .meta{color:var(--muted); font-size:11px;}
  .note-input{display:flex; gap:8px; margin-top:8px;}
  .note-input input{flex:1;}
  .empty{color:var(--muted); text-align:center; padding:40px 0;}
  .badge-count{background:var(--urgent); color:#fff; border-radius:100px; font-size:11px; padding:1px 7px; margin-right:4px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>فريق الصيانة</h1>
    <span class="brand">فريق بن عقول / جست بنز</span>
  </header>

  <div id="loginCard" class="card">
    <label for="staffName">اسمك</label>
    <input id="staffName" type="text" placeholder="اسم الفني" style="width:100%; margin-bottom:10px;">
    <button id="enterBtn" style="width:100%;">دخول</button>
  </div>

  <div id="mainArea" class="hidden" style="display:none;">
    <div class="filters">
      <div>
        <label>الحالة</label>
        <select id="statusFilter">
          <option value="open,in_progress" selected>مفتوح + قيد التنفيذ</option>
          <option value="open">مفتوح فقط</option>
          <option value="in_progress">قيد التنفيذ فقط</option>
          <option value="closed">مقفل</option>
          <option value="">الكل</option>
        </select>
      </div>
      <div>
        <label>الفرع</label>
        <select id="branchFilter"><option value="">كل الفروع</option></select>
      </div>
      <div>
        <label>الأولوية</label>
        <select id="priorityFilter">
          <option value="">كل الأولويات</option>
          <option value="urgent">عاجل</option>
          <option value="normal">عادي</option>
          <option value="low">غير عاجل</option>
        </select>
      </div>
    </div>
    <div id="ticketList"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lzadmbjhcxqvafykntsp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6YWRtYmpoY3hxdmFmeWtudHNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjQwOTYsImV4cCI6MjEwNTA0MDA5Nn0.HNGwF8_lHrUHU_Xhx9Ymn0eoLHGaJ2GVd69umNNkXCI";

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ throw new Error(await res.text()); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const STATUS_LABEL = {open:"مفتوح", in_progress:"قيد التنفيذ", closed:"مقفل"};
const PRIORITY_LABEL = {urgent:"عاجل", normal:"عادي", low:"غير عاجل"};
let staffName = "";
let branches = [];

document.getElementById("enterBtn").addEventListener("click", async ()=>{
  const name = document.getElementById("staffName").value.trim();
  if(!name) return;
  staffName = name;
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("mainArea").style.display = "block";
  await loadBranches();
  await loadTickets();
});

async function loadBranches(){
  branches = await sb("branches?select=id,name&order=name.asc");
  const sel = document.getElementById("branchFilter");
  branches.forEach(b=>{
    const o = document.createElement("option");
    o.value = b.id; o.textContent = b.name;
    sel.appendChild(o);
  });
}

["statusFilter","branchFilter","priorityFilter"].forEach(id=>{
  document.getElementById(id).addEventListener("change", loadTickets);
});

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

async function loadTickets(){
  const list = document.getElementById("ticketList");
  list.innerHTML = '<div class="empty">جارِ التحميل...</div>';
  const status = document.getElementById("statusFilter").value;
  const branchId = document.getElementById("branchFilter").value;
  const priority = document.getElementById("priorityFilter").value;

  let query = "maintenance_tickets?select=*,branches(name),maintenance_categories(name),maintenance_staff(name)&order=created_at.desc";
  if(status){
    const vals = status.split(",").map(s=>`"${s}"`).join(",");
    query += `&status=in.(${vals})`;
  }
  if(branchId) query += `&branch_id=eq.${branchId}`;
  if(priority) query += `&priority=eq.${priority}`;

  try{
    const rows = await sb(query);
    if(rows.length === 0){
      list.innerHTML = '<div class="empty">لا توجد بلاغات مطابقة.</div>';
      return;
    }
    list.innerHTML = "";
    for(const t of rows){
      list.appendChild(await renderTicket(t));
    }
  }catch(e){
    list.innerHTML = '<div class="empty">تعذر تحميل البلاغات.</div>';
  }
}

async function renderTicket(t){
  const div = document.createElement("div");
  div.className = "ticket";
  const date = new Date(t.created_at).toLocaleString("ar-BH", {dateStyle:"medium", timeStyle:"short"});
  div.innerHTML = `
    <div class="ticket-top">
      <span class="branch-name">${t.branches?.name || "—"}</span>
      <span class="status-pill status-${t.status}">${STATUS_LABEL[t.status]}</span>
    </div>
    <div class="ticket-meta">
      <span class="priority-tag priority-${t.priority}">${PRIORITY_LABEL[t.priority]}</span>
      ${t.maintenance_categories?.name || "—"} · ${date}${t.reported_by ? " · بلّغ: " + escapeHtml(t.reported_by) : ""}
    </div>
    <div class="ticket-desc">${escapeHtml(t.description)}</div>
    <div class="row">
      ${t.status !== "closed" ? `
        <select class="statusSelect">
          <option value="open" ${t.status==="open"?"selected":""}>مفتوح</option>
          <option value="in_progress" ${t.status==="in_progress"?"selected":""}>قيد التنفيذ</option>
          <option value="closed" ${t.status==="closed"?"selected":""}>مقفل</option>
        </select>
        <button class="assignBtn">${t.maintenance_staff?.name ? "معيّن: " + escapeHtml(t.maintenance_staff.name) : "استلام البلاغ"}</button>
      ` : `<span class="ticket-meta">تم الإقفال${t.maintenance_staff?.name ? " بواسطة " + escapeHtml(t.maintenance_staff.name) : ""}</span>`}
    </div>
    <div class="notes">
      <div class="notesList"></div>
      ${t.status !== "closed" ? `
      <div class="note-input">
        <input type="text" class="noteInput" placeholder="أضف ملاحظة...">
        <button class="noteBtn ghost">إضافة</button>
      </div>` : ""}
    </div>
  `;

  const notesListEl = div.querySelector(".notesList");
  loadNotes(t.id, notesListEl);

  const statusSel = div.querySelector(".statusSelect");
  if(statusSel){
    statusSel.addEventListener("change", async ()=>{
      const newStatus = statusSel.value;
      const patch = { status: newStatus };
      if(newStatus === "in_progress" && !t.started_at) patch.started_at = new Date().toISOString();
      if(newStatus === "closed") patch.closed_at = new Date().toISOString();
      await sb(`maintenance_tickets?id=eq.${t.id}`, { method:"PATCH", body: JSON.stringify(patch) });
      await loadTickets();
    });
  }

  const assignBtn = div.querySelector(".assignBtn");
  if(assignBtn){
    assignBtn.addEventListener("click", async ()=>{
      const staffRows = await sb(`maintenance_staff?name=eq.${encodeURIComponent(staffName)}`);
      let staff = staffRows[0];
      if(!staff){
        const created = await sb("maintenance_staff", { method:"POST", body: JSON.stringify({name: staffName}) });
        staff = created[0];
      }
      await sb(`maintenance_tickets?id=eq.${t.id}`, {
        method:"PATCH",
        body: JSON.stringify({ assigned_to: staff.id, status: t.status === "open" ? "in_progress" : t.status, started_at: t.started_at || new Date().toISOString() })
      });
      await loadTickets();
    });
  }

  const noteBtn = div.querySelector(".noteBtn");
  if(noteBtn){
    noteBtn.addEventListener("click", async ()=>{
      const input = div.querySelector(".noteInput");
      const val = input.value.trim();
      if(!val) return;
      await sb("ticket_updates", { method:"POST", body: JSON.stringify({ ticket_id: t.id, note: val, created_by: staffName }) });
      input.value = "";
      loadNotes(t.id, notesListEl);
    });
  }

  return div;
}

async function loadNotes(ticketId, el){
  try{
    const notes = await sb(`ticket_updates?ticket_id=eq.${ticketId}&select=*&order=created_at.asc`);
    el.innerHTML = notes.map(n=>{
      const d = new Date(n.created_at).toLocaleString("ar-BH", {dateStyle:"short", timeStyle:"short"});
      return `<div class="note">${escapeHtml(n.note)}<div class="meta">${escapeHtml(n.created_by||"")} · ${d}</div></div>`;
    }).join("");
  }catch(e){}
}
</script>
</body>
</html>
