<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Supervisor</title>
<style>
  :root{
    --bg:#F5F2EC; --surface:#FFFFFF; --ink:#211E1A; --muted:#7A7268; --line:#E4DFD5;
    --primary:#2C4A3E; --primary-ink:#FFFFFF;
    --urgent:#B0432A; --warn:#C68A2E; --closed:#7C8A80;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:820px; margin:0 auto; padding:24px 18px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px;}
  header h1{font-size:20px; margin:0; font-weight:700;}
  header .brand{font-size:13px; color:var(--muted);}
  #langToggle{width:auto; margin:0; padding:6px 12px; font-size:12.5px; font-weight:700; background:var(--surface); color:var(--primary); border:1px solid var(--primary); border-radius:100px; cursor:pointer;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px;}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  select, input{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#FCFBF9; color:var(--ink); font-family:inherit;}
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .filters > div{flex:1; min-width:130px;}
  .filters select{width:100%;}
  .ticket{border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--surface);}
  .ticket-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .branch-name{font-weight:700; font-size:15px;}
  .status-pill{font-size:11px; padding:3px 10px; border-radius:100px; font-weight:700; white-space:nowrap;}
  .status-open{background:#F6E4DE; color:var(--urgent);}
  .status-in_progress{background:#F7EBD7; color:#8A5F14;}
  .status-closed{background:#EAEBE8; color:var(--closed);}
  .priority-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; margin-inline-end:6px;}
  .priority-urgent{color:var(--urgent); background:#F6E4DE;}
  .priority-normal{color:var(--ink); background:#EEECE6;}
  .priority-low{color:var(--muted); background:#EEECE6;}
  .ticket-desc{font-size:14px; margin:8px 0; line-height:1.5;}
  .mediaGallery{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .mediaThumb{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--line); display:block;}
  .mediaThumb img, .mediaThumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .mediaThumb .playBadge{position:absolute; bottom:2px; inset-inline-end:2px; background:rgba(33,30,26,.75); color:#fff; font-size:10px; padding:1px 4px; border-radius:5px;}
  .ticket-meta{font-size:12px; color:var(--muted); margin-bottom:10px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .row select, .row button{flex:1; min-width:120px;}
  button{padding:10px 14px; border:none; border-radius:8px; background:var(--primary); color:var(--primary-ink); font-size:13px; font-weight:700; cursor:pointer;}
  button.ghost{background:transparent; color:var(--primary); border:1px solid var(--primary);}
  button:disabled{opacity:.5; cursor:default;}
  .notes{margin-top:10px; border-top:1px solid var(--line); padding-top:10px;}
  .note{font-size:13px; margin-bottom:6px; color:var(--ink);}
  .note .meta{color:var(--muted); font-size:11px;}
  .note-input{display:flex; gap:8px; margin-top:8px;}
  .note-input input{flex:1;}
  .empty{color:var(--muted); text-align:center; padding:40px 0;}
  .hidden{display:none !important;}
  .msg{font-size:13px;}
  .msg.err{color:var(--urgent);}
  .msg.ok{color:var(--primary);}
  .detailsToggleWrap{margin-top:8px;}
  .detailsToggleWrap a{font-size:12px; color:var(--primary); text-decoration:none; font-weight:600;}
  .detailsBox{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .detailsRow{font-size:12.5px; color:var(--muted); margin-bottom:6px;}
  .detailsRow b{color:var(--ink);}
  .detailsBox label{display:block; font-size:11.5px; color:var(--muted); margin:8px 0 4px;}
  .detailsBox input{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; background:#FCFBF9; color:var(--ink); font-family:inherit;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .stat .num{font-size:26px; font-weight:800; line-height:1;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:6px;}
  .stat.urgent .num{color:var(--urgent);}
  .section-title{font-size:15px; font-weight:700; margin:0 0 12px;}
  .breakdown{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .breakdown span{font-size:12px; background:#EEECE6; padding:4px 10px; border-radius:100px; color:var(--ink);}
</style>
</head>
<body>

      </div>
      <div>

        <select id="priorityFilter">

          <option value="low" data-i18n="low">غير عاجل</option>

    </div>

  </div>
</div>

let lang = "en";
function t(key){ return I18N[lang][key]; }

function applyLanguage(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    if(el.childElementCount === 0){ el.textContent = t(el.getAttribute("data-i18n")); }
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
  });
  if(document.getElementById("mainArea").style.display === "block"){
    loadTickets();
    loadReportStats();
  }
}

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ throw new Error(await res.text()); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

let staffName = "";
let branches = [];

document.getElementById("forgotPassLink").addEventListener("click", async (e)=>{
  e.preventDefault();
  const msgEl = document.getElementById("loginMsg");
  const text = encodeURIComponent(t("forgotWhatsappMsg"));
  try{
    const rows = await sb("admin_settings?select=team_whatsapp_numbers&limit=1");
    const numbers = (rows[0]?.team_whatsapp_numbers || "").split(",").map(s=>s.trim()).filter(Boolean);
    if(!numbers.length){ msgEl.textContent = t("noTeamNumber"); return; }
    window.open(`https://wa.me/${numbers[0]}?text=${text}`, "_blank");
  }catch(e){
    msgEl.textContent = t("genericError");
  }
});

document.getElementById("enterBtn").addEventListener("click", async ()=>{
  const name = document.getElementById("staffName").value.trim();
  const pass = document.getElementById("teamPass").value;
  const msgEl = document.getElementById("loginMsg");
  msgEl.className = "msg";
  msgEl.style.color = "";
  if(!name){ msgEl.className = "msg err"; msgEl.textContent = t("enterName"); return; }
  msgEl.textContent = "Step 1: checking password...";
  try{
    const rows = await sb("admin_settings?select=supervisor_password&limit=1");
    if(rows.length === 0 || rows[0].supervisor_password !== pass){
      msgEl.className = "msg err";
      msgEl.textContent = t("wrongPassword");
      return;
    }
  }catch(e){
    msgEl.className = "msg err";
    msgEl.textContent = "Step 1 FAILED: " + e.message;
    return;
  }
  msgEl.textContent = "Step 2: password OK, loading page...";
  staffName = name;
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("mainArea").style.display = "block";
  const statusEl = document.getElementById("statusMsg");
  try{
    statusEl.textContent = "Step 3: loading branches...";
    await loadBranches();
    statusEl.textContent = "Step 4: loading tickets...";
    await loadTickets();
    statusEl.textContent = "Step 5: loading stats...";
    await loadReportStats();
    statusEl.textContent = "";
  }catch(e){
    statusEl.textContent = "";
    document.getElementById("ticketList").innerHTML = `<div class="empty">${t("loadFail")}: ${e.message}</div>`;
  }
});

async function loadReportStats(){
  try{
    const allTickets = await sb("maintenance_tickets?select=status,priority,cost,created_at,closed_at,branches(name)");
    const open = allTickets.filter(tk=>tk.status==="open").length;
    const inProgress = allTickets.filter(tk=>tk.status==="in_progress").length;
    const urgent = allTickets.filter(tk=>tk.status!=="closed" && tk.priority==="urgent").length;
    const closedTickets = allTickets.filter(tk=>tk.status==="closed" && tk.closed_at);
    let avgHours = t("dash");
    if(closedTickets.length){
      const totalMs = closedTickets.reduce((sum,tk)=> sum + (new Date(tk.closed_at)-new Date(tk.created_at)), 0);
      avgHours = Math.round(totalMs / closedTickets.length / 3600000) + " " + t("hrs");
    }
    const totalCost = allTickets.reduce((sum,tk)=> sum + (tk.cost || 0), 0);
    const row = document.getElementById("statsRow");
    row.innerHTML = `
      <div class="stat"><div class="num">${open}</div><div class="lbl">${t("openTickets")}</div></div>
      <div class="stat"><div class="num">${inProgress}</div><div class="lbl">${t("inProgressLbl")}</div></div>
      <div class="stat urgent"><div class="num">${urgent}</div><div class="lbl">${t("urgentUnresolved")}</div></div>
      <div class="stat"><div class="num">${allTickets.length}</div><div class="lbl">${t("totalTickets")}</div></div>
      <div class="stat"><div class="num">${avgHours}</div><div class="lbl">${t("avgClose")}</div></div>
      <div class="stat"><div class="num">${totalCost.toFixed(3)}</div><div class="lbl">${t("totalCost")}</div></div>
    `;

    const counts = {};
    allTickets.filter(tk=>tk.status!=="closed").forEach(tk=>{
      const bname = tk.branches?.name || t("dash");
      counts[bname] = (counts[bname]||0) + 1;
    });
    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const bd = document.getElementById("branchBreakdown");
    bd.innerHTML = entries.length === 0
      ? `<span>${t("noOpenTickets")}</span>`
      : entries.map(([name,count])=>`<span>${escapeHtml(name)}: ${count}</span>`).join("");
  }catch(e){}
}

async function loadBranches(){
  branches = await sb("branches?select=id,name&order=name.asc");
  const sel = document.getElementById("branchFilter");
  const opt0 = sel.querySelector('option[value=""]');
  sel.innerHTML = "";
  sel.appendChild(opt0);
  branches.forEach(b=>{
    const o = document.createElement("option");
    o.value = b.id; o.textContent = b.name;
    sel.appendChild(o);
  });
}

["statusFilter","branchFilter","priorityFilter"].forEach(id=>{
  document.getElementById(id).addEventListener("change", loadTickets);
});

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

async function loadTickets(){
  const list = document.getElementById("ticketList");
  list.innerHTML = `<div class="empty">${t("loading")}</div>`;
  const status = document.getElementById("statusFilter").value;
  const branchId = document.getElementById("branchFilter").value;
  const priority = document.getElementById("priorityFilter").value;

  let query = "maintenance_tickets?select=*,branches(name),maintenance_categories(name,name_en),maintenance_staff(name)&order=created_at.desc";
  if(status){
    const vals = status.split(",").map(s=>`"${s}"`).join(",");
    query += `&status=in.(${vals})`;
  }
  if(branchId) query += `&branch_id=eq.${branchId}`;
  if(priority) query += `&priority=eq.${priority}`;

  try{
    const rows = await sb(query);
    if(rows.length === 0){
      list.innerHTML = `<div class="empty">${t("noMatchingTickets")}</div>`;
      return;
    }
    list.innerHTML = "";
    for(const t2 of rows){
      list.appendChild(await renderTicket(t2));
    }
  }catch(e){
    list.innerHTML = `<div class="empty">${t("loadFail")}</div>`;
  }
}

async function renderTicket(tk){
  const div = document.createElement("div");
  div.className = "ticket";
  const localeStr = lang === "ar" ? "ar-BH" : "en-GB";
  const date = new Date(tk.created_at).toLocaleString(localeStr, {dateStyle:"medium", timeStyle:"short"});
  const catName = lang === "en" ? (tk.maintenance_categories?.name_en || tk.maintenance_categories?.name) : tk.maintenance_categories?.name;
  div.innerHTML = `
    <div class="ticket-top">
      <span class="branch-name">#${tk.ticket_number} · ${tk.branches?.name || t("dash")}</span>
      <span class="status-pill status-${tk.status}">${t(tk.status)}</span>
    </div>
    <div class="ticket-meta">
      <span class="priority-tag priority-${tk.priority}">${t(tk.priority)}</span>
      ${catName || t("dash")} · ${date}${tk.reported_by ? " · " + t("reportedBy") + escapeHtml(tk.reported_by) : ""}
    </div>
    <div class="ticket-desc">${escapeHtml(tk.description)}</div>
    <div class="mediaGallery"></div>
    <div class="row">
      ${tk.status !== "closed" ? `
        <select class="statusSelect">
          <option value="open" ${tk.status==="open"?"selected":""}>${t("open")}</option>
          <option value="in_progress" ${tk.status==="in_progress"?"selected":""}>${t("in_progress")}</option>
          <option value="closed" ${tk.status==="closed"?"selected":""}>${t("closed")}</option>
        </select>
        <button class="assignBtn">${tk.maintenance_staff?.name ? t("assignedTo") + escapeHtml(tk.maintenance_staff.name) : t("claimTicket")}</button>
      ` : `<span class="ticket-meta">${tk.maintenance_staff?.name ? t("closedBy") + escapeHtml(tk.maintenance_staff.name) : t("closedNoBy")}</span>`}
    </div>
    <div class="notes">
      <div class="notesList"></div>
      ${tk.status !== "closed" ? `
      <div class="note-input">
        <input type="text" class="noteInput" placeholder="${t("addNote")}">
        <button class="noteBtn ghost">${t("add")}</button>
      </div>` : ""}
    </div>
    <div class="detailsToggleWrap">
      <a href="#" class="detailsToggle">${t("detailsToggle")}</a>
    </div>
    <div class="detailsBox hidden">
      <div class="detailsRow"><span>${t("started")}</span> <b>${tk.started_at ? new Date(tk.started_at).toLocaleString(localeStr, {dateStyle:"medium", timeStyle:"short"}) : t("dash")}</b></div>
      <div class="detailsRow"><span>${t("finished")}</span> <b>${tk.closed_at ? new Date(tk.closed_at).toLocaleString(localeStr, {dateStyle:"medium", timeStyle:"short"}) : t("dash")}</b></div>
      <label>${t("authorizedBy")}</label>
      <input type="text" class="authorizedByInput" value="${escapeHtml(tk.authorized_by || "")}" placeholder="${t("authorizedByPh")}">
      <label>${t("performedBy")}</label>
      <input type="text" class="performedByInput" value="${escapeHtml(tk.performed_by || "")}" placeholder="${t("performedByPh")}">
      <label>${t("approvedBy")}</label>
      <input type="text" class="approvedByInput" value="${escapeHtml(tk.approved_by || "")}" placeholder="${t("approvedByPh")}">
      <label>${t("cost")}</label>
      <input type="number" step="0.001" class="costInput" value="${tk.cost ?? ""}" placeholder="0.000">
      <button type="button" class="saveDetailsBtn ghost" style="margin-top:10px;">${t("saveDetails")}</button>
      <div class="detailsMsg msg"></div>
    </div>
  `;

  const notesListEl = div.querySelector(".notesList");
  loadNotes(tk.id, notesListEl);

  const mediaEl = div.querySelector(".mediaGallery");
  loadMedia(tk.id, mediaEl);

  const statusSel = div.querySelector(".statusSelect");
  if(statusSel){
    statusSel.addEventListener("change", async ()=>{
      const newStatus = statusSel.value;
      const patch = { status: newStatus };
      if(newStatus === "in_progress" && !tk.started_at) patch.started_at = new Date().toISOString();
      if(newStatus === "closed") patch.closed_at = new Date().toISOString();
      await sb(`maintenance_tickets?id=eq.${tk.id}`, { method:"PATCH", body: JSON.stringify(patch) });
      await loadTickets();
      await loadReportStats();
    });
  }

  const assignBtn = div.querySelector(".assignBtn");
  if(assignBtn){
    assignBtn.addEventListener("click", async ()=>{
      const staffRows = await sb(`maintenance_staff?name=eq.${encodeURIComponent(staffName)}`);
      let staff = staffRows[0];
      if(!staff){
        const created = await sb("maintenance_staff", { method:"POST", body: JSON.stringify({name: staffName}) });
        staff = created[0];
      }
      await sb(`maintenance_tickets?id=eq.${tk.id}`, {
        method:"PATCH",
        body: JSON.stringify({ assigned_to: staff.id, status: tk.status === "open" ? "in_progress" : tk.status, started_at: tk.started_at || new Date().toISOString() })
      });
      await loadTickets();
      await loadReportStats();
    });
  }

  const noteBtn = div.querySelector(".noteBtn");
  if(noteBtn){
    noteBtn.addEventListener("click", async ()=>{
      const input = div.querySelector(".noteInput");
      const val = input.value.trim();
      if(!val) return;
      await sb("ticket_updates", { method:"POST", body: JSON.stringify({ ticket_id: tk.id, note: val, created_by: staffName }) });
      input.value = "";
      loadNotes(tk.id, notesListEl);
    });
  }

  const detailsToggle = div.querySelector(".detailsToggle");
  const detailsBox = div.querySelector(".detailsBox");
  detailsToggle.addEventListener("click", (e)=>{
    e.preventDefault();
    detailsBox.classList.toggle("hidden");
  });

  const saveDetailsBtn = div.querySelector(".saveDetailsBtn");
  saveDetailsBtn.addEventListener("click", async ()=>{
    const msgEl = div.querySelector(".detailsMsg");
    msgEl.className = "msg"; msgEl.textContent = "";
    const costVal = div.querySelector(".costInput").value;
    const patch = {
      authorized_by: div.querySelector(".authorizedByInput").value.trim() || null,
      performed_by: div.querySelector(".performedByInput").value.trim() || null,
      approved_by: div.querySelector(".approvedByInput").value.trim() || null,
      cost: costVal === "" ? null : parseFloat(costVal)
    };
    saveDetailsBtn.disabled = true; saveDetailsBtn.textContent = t("saving");
    try{
      await sb(`maintenance_tickets?id=eq.${tk.id}`, { method:"PATCH", body: JSON.stringify(patch) });
      msgEl.className = "msg ok"; msgEl.textContent = t("saved");
      await loadReportStats();
    }catch(e){
      msgEl.className = "msg err"; msgEl.textContent = t("saveFail");
    }finally{
      saveDetailsBtn.disabled = false; saveDetailsBtn.textContent = t("saveDetails");
    }
  });

  return div;
}

async function loadMedia(ticketId, el){
  try{
    const photos = await sb(`ticket_photos?ticket_id=eq.${ticketId}&select=*&order=created_at.asc`);
    if(photos.length === 0) return;
    el.innerHTML = photos.map(p=>{
      const isVideo = /\.(mp4|mov|webm|m4v|avi)$/i.test(p.url);
      return isVideo
        ? `<a href="${p.url}" target="_blank" class="mediaThumb"><video src="${p.url}" muted onerror="this.closest('a').style.display='none'"></video><span class="playBadge">▶</span></a>`
        : `<a href="${p.url}" target="_blank" class="mediaThumb"><img src="${p.url}" onerror="this.closest('a').style.display='none'"></a>`;
    }).join("");
  }catch(e){}
}

async function loadNotes(ticketId, el){
  try{
    const notes = await sb(`ticket_updates?ticket_id=eq.${ticketId}&select=*&order=created_at.asc`);
    const localeStr = lang === "ar" ? "ar-BH" : "en-GB";
    el.innerHTML = notes.map(n=>{
      const d = new Date(n.created_at).toLocaleString(localeStr, {dateStyle:"short", timeStyle:"short"});
      return `<div class="note">${escapeHtml(n.note)}<div class="meta">${escapeHtml(n.created_by||"")} · ${d}</div></div>`;
    }).join("");
  }catch(e){}
}

function enableEnterNav(containerId, buttonId){
  const container = document.getElementById(containerId);
  const button = document.getElementById(buttonId);
  container.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    const tag = e.target.tagName;
    if(tag === "TEXTAREA" || tag === "BUTTON" || tag === "A") return;
    e.preventDefault();
    const items = Array.from(container.querySelectorAll('input:not([type=radio]):not([type=checkbox]):not([type=file]), select'));
    const idx = items.indexOf(e.target);
    if(idx > -1 && idx < items.length - 1){
      items[idx+1].focus();
    }else{
      button.click();
    }
  });
}
enableEnterNav("loginCard", "enterBtn");

applyLanguage();
</script>
